[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx"
version = "0.2.0"
description = "The primary application-facing Python SDK for Cognityx."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0e73a286ff3c070f5e3fb30df7f00eab08b5c02c",
  "cognityx-ingest @ git+https://github.com/cognityx/cognityx-ingest.git@07f5ba96d68eab1e1914b0d0a4bc7a17183ac469",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@e4312fd461df97ffcefc54352b9b76f1dd6e6860",
]

[project.scripts]
cogni = "cognityx.cli:main"

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0e73a286ff3c070f5e3fb30df7f00eab08b5c02c",
  "cognityx-ingest @ git+https://github.com/cognityx/cognityx-ingest.git@07f5ba96d68eab1e1914b0d0a4bc7a17183ac469",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@e4312fd461df97ffcefc54352b9b76f1dd6e6860",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/cognityx/cognityx-sdk"
