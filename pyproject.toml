[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx"
version = "0.2.0"
description = "The primary application-facing Python SDK for Cognityx."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0d159136ebac6ce5362a5092ea4d6d2f181e9c89",
  "cognityx-ingest @ git+https://github.com/cognityx/cognityx-ingest.git@1be62570e971e4a471ab2bbb1d9a1f52edc9193c",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@bfd10769703dfca97e6a70b0d242c5ccd961d702",
]

[project.scripts]
cogni = "cognityx.cli:main"

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0d159136ebac6ce5362a5092ea4d6d2f181e9c89",
  "cognityx-ingest @ git+https://github.com/cognityx/cognityx-ingest.git@1be62570e971e4a471ab2bbb1d9a1f52edc9193c",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@bfd10769703dfca97e6a70b0d242c5ccd961d702",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/cognityx/cognityx-sdk"
