[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx"
version = "0.2.0"
description = "The primary application-facing Python SDK for Cognityx."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@b23220b69fcb182e681cf13276c37474666c9bd2",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@4b47b898b2fb465263d8c44350d4241f52b13c90",
  "cognityx-ingest @ git+https://github.com/cognityx/cognityx-ingest.git@56716dbdebde9bd92069cbd415aa7f657d55d9dd",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@e4312fd461df97ffcefc54352b9b76f1dd6e6860",
  "cognityx-experiments @ git+https://github.com/cognityx/cognityx-experiments.git@b7138689c33cd102370932e2269cba8c88a7d692",
]

[project.scripts]
cogni = "cognityx.cli:main"

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@b23220b69fcb182e681cf13276c37474666c9bd2",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@4b47b898b2fb465263d8c44350d4241f52b13c90",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@e4312fd461df97ffcefc54352b9b76f1dd6e6860",
  "cognityx-inference @ git+https://github.com/cognityx/cognityx-inference.git@061cb6a9cfd9c999c4a6ac68f650a2b0f6efd3c7",
  "cognityx-experiments @ git+https://github.com/cognityx/cognityx-experiments.git@b7138689c33cd102370932e2269cba8c88a7d692",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9"]
inference = ["cognityx-inference @ git+https://github.com/cognityx/cognityx-inference.git@061cb6a9cfd9c999c4a6ac68f650a2b0f6efd3c7"]
rich-ingest = ["cognityx-ingest[pymupdf,docling] @ git+https://github.com/cognityx/cognityx-ingest.git@56716dbdebde9bd92069cbd415aa7f657d55d9dd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/cognityx/cognityx-sdk"
